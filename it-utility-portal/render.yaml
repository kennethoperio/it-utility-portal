services:
  - type: web
    name: it-utility-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 600 --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: it-storage
      mountPath: /app/uploads
      sizeGB: 10
